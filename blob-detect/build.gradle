
dependencies {


    implementation project(':common')

    implementation 'org.scala-lang.modules:scala-parallel-collections_2.13:1.2.0'

    // OpenCV via official artifacts or system; keep original logic but update
    implementation 'org.openpnp:opencv:4.9.0-0'

    // QR SCANNER
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
 	
    // ON WINDOWS, OPENCV SHOULD BE INSTALLED SEPARATELY

    // Webcam interface
    implementation group: 'com.github.sarxos', name: 'webcam-capture', version: '0.3.12'
}

clean.doFirst {
    delete "test-img"
}

task runBlobDetect(type: JavaExec, dependsOn: classes) {
    main = 'imgproc.GUI'
    classpath sourceSets.main.runtimeClasspath
    classpath configurations.runtimeClasspath
    systemProperty "java.library.path", "./lib"
}

tasks.withType(Test) {
    systemProperty "java.library.path", "./lib"
}

task repl(type:JavaExec) {
  main = "scala.tools.nsc.MainGenericRunner"
  classpath = sourceSets.main.runtimeClasspath
  standardInput System.in
  args '-usejavacp'
}

task findBestNeuralNetwork( type: JavaExec, dependsOn: classes){
    main = 'imgproc.FindBestNeuralNetworkApp'
    classpath sourceSets.main.runtimeClasspath
    classpath configurations.runtimeClasspath
    jvmArgs "-Xmx24G"
    systemProperty "java.library.path", "./lib"
}
