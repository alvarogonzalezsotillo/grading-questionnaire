
apply plugin: 'application'

dependencies{
    implementation project(':common')
}

def mainClass = "giftToLatex.Main"

mainClassName = mainClass

run {
    if(project.hasProperty('args')){
        args project.args.split('\\s')
    }
}

clean.doFirst {
    delete "gifttolatex.jar"
    delete "generated.tex"
    delete "generated.pdf"
    delete "generated.gift"
}


shadowJar {
   archiveBaseName.set('shadow')
}

task install(dependsOn: shadowJar) doLast {
    def stub = "#!/bin/sh\n" +
        "MYSELF=`which \"\$0\" 2>/dev/null`\n" +
        "[ \$? -gt 0 -a -f \"\$0\" ] && MYSELF=\"./\$0\"\n" +
        "exec java -jar \$MYSELF \"\$@\"\n" +
        "exit \$?\n"

    def file = new File(project.layout.buildDirectory.get().asFile, "libs/shadow-all.jar")
    def executable = new File("gifttolatex")
    // Recreate instead of overwriting: this repo is shared between two users and
    // chmod on a file owned by somebody else fails with EPERM.
    executable.delete()
    def os = new java.io.FileOutputStream( executable )
    def is =new java.io.FileInputStream(file)
    os.write(stub.getBytes())
    def buffer = new byte[1024]
    def b = is.read(buffer)
    while( b > 0){
        os.write(buffer,0,b)
        b = is.read(buffer)
    }
    os.close()
    is.close()
    executable.setExecutable(true,false)
}
