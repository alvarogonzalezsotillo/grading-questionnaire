buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.github.johnrengelman:shadow:8.1.1'
    }
}

//SAME AS --stacktrace
//gradle.startParameter.showStacktrace = org.gradle.logging.ShowStacktrace.ALWAYS

repositories {
    mavenCentral()
}


subprojects{
    repositories {
        mavenCentral()
    }


    apply plugin: 'java'
    apply plugin: 'scala'
    apply plugin: 'com.github.johnrengelman.shadow'


    dependencies {
        implementation group: 'org.scala-lang', name: 'scala-library', version: '2.13.16'
        implementation group: 'org.scala-lang.modules', name: 'scala-parser-combinators_2.13', version: '2.4.0'

        implementation group: 'com.github.scopt', name: 'scopt_2.13', version: '4.1.0'
        testImplementation group: "org.scalatest", name: "scalatest_2.13", version: "3.2.19"
        testImplementation 'junit:junit:4.13.2'

        // logging
        implementation("com.typesafe.scala-logging:scala-logging_2.13:3.9.5")
        testImplementation group: 'com.typesafe.scala-logging', name: 'scala-logging_2.13', version: '3.9.5'
        testImplementation 'org.slf4j:slf4j-api:2.0.16'
        runtimeOnly 'org.slf4j:slf4j-jdk14:2.0.16'


        // https://mvnrepository.com/artifact/org.scalatestplus/junit-4-13
        testImplementation group: 'org.scalatestplus', name: 'junit-4-13_2.13', version: '3.2.19.0'
        testImplementation "org.scalatestplus:scalatestplus-junit_2.13:1.0.0-SNAP9"
    }

}


tasks.register('miwrapper', Wrapper) {
    gradleVersion = '8.11.1'
}


